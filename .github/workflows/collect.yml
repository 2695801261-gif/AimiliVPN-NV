name: Collect and publish nodes

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */12 * * *"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run collector unit tests
        run: python -m unittest discover -s collector/tests -v
      - name: Collect VPNGate snapshot
        run: python collector/main.py --source vpngate --output nodes.json
      - name: Save collection snapshot for personal inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: personal-node-snapshot
          path: nodes.json
          if-no-files-found: ignore
          retention-days: 3
      - name: Publish candidate snapshot to Worker
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_ADMIN_TOKEN: ${{ secrets.WORKER_ADMIN_TOKEN }}
        run: |
          if [ -z "$WORKER_URL" ] || [ -z "$WORKER_ADMIN_TOKEN" ]; then
            echo "::notice::Worker secrets are not configured; collection succeeded but publish was skipped."
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            -X POST "$WORKER_URL/api/nodes/import" \
            -H "Authorization: Bearer $WORKER_ADMIN_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @nodes.json
      - name: Write summary
        if: always()
        run: |
          if [ -f nodes.json ]; then python -c 'import json; d=json.load(open("nodes.json")); print("Collected candidates:", d.get("count", 0))' >> "$GITHUB_STEP_SUMMARY"; fi
