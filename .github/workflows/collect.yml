name: Collect and publish nodes

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */12 * * *"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install YAML parser for public Mihomo feed
        run: python -m pip install 'PyYAML>=6.0,<7'
      - name: Run collector unit tests
        run: python -m unittest discover -s collector/tests -v
      - name: Collect VPNGate snapshot
        continue-on-error: true
        run: python -m collector.main --source vpngate --output nodes.json
      - name: Fetch small Mihomo-compatible public candidate set
        continue-on-error: true
        run: python -m collector.fetch_public_clash --output public-clash-candidates.json --limit 50
      - name: Install official Mihomo binary
        if: ${{ hashFiles('public-clash-candidates.json') != '' }}
        run: |
          release_json="$(curl -fsSL https://api.github.com/repos/MetaCubeX/mihomo/releases/latest)"
          asset="$(printf '%s' "$release_json" | jq -er '.assets[] | select(.name | startswith("mihomo-linux-amd64-compatible-") and endswith(".gz")) | [.browser_download_url, (.digest // "")] | @tsv' | head -n 1)"
          test -n "$asset"
          asset_url="$(printf '%s' "$asset" | cut -f1)"
          expected_digest="$(printf '%s' "$asset" | cut -f2)"
          curl -fsSL "$asset_url" -o /tmp/mihomo.gz
          if [ -n "$expected_digest" ]; then
            printf '%s  %s\n' "${expected_digest#sha256:}" /tmp/mihomo.gz | sha256sum -c -
          fi
          gzip -t /tmp/mihomo.gz
          gzip -dc /tmp/mihomo.gz > /tmp/mihomo
          chmod +x /tmp/mihomo
          /tmp/mihomo -v
      - name: Verify real Mihomo proxy and public egress
        if: ${{ hashFiles('public-clash-candidates.json') != '' }}
        continue-on-error: true
        run: |
          python collector/verify_mihomo.py --mihomo /tmp/mihomo --input public-clash-candidates.json --output verified-clash-candidates.json --limit 20 --egress-attempts 2
      - name: Build verified-only Mihomo subscription
        if: ${{ hashFiles('verified-clash-candidates.json') != '' }}
        run: python -m collector.build_subscription --input verified-clash-candidates.json --output mihomo-subscription.yaml
      - name: Redact snapshots before public artifact upload
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          def load(path):
              try:
                  return json.loads(Path(path).read_text(encoding="utf-8"))
              except (OSError, ValueError):
                  return None
          def save(path, data):
              Path(path).write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding="utf-8")
          d = load("nodes.json")
          if d is not None:
              safe_nodes = []
              for n in d.get("nodes", []):
                  safe_nodes.append({k:n.get(k) for k in ("id","country","country_code","protocol","transport","endpoint","status","observed_at","last_checked_at","latency_ms","egress_ip","metadata") if k in n})
              save("nodes-summary.json", {"source":d.get("source"),"generated_at":d.get("generated_at"),"count":len(safe_nodes),"nodes":safe_nodes})
          d = load("public-clash-candidates.json")
          if d is not None:
              safe = [{"name":p.get("name"),"type":p.get("type"),"server":p.get("server"),"port":p.get("port")} for p in d.get("proxies", [])]
              save("public-clash-summary.json", {"source":d.get("source"),"generated_at":d.get("generated_at"),"count":len(safe),"candidates":safe})
          d = load("verified-clash-candidates.json")
          if d is not None:
              safe = [{"name":p.get("name"),"type":p.get("type"),"server":p.get("server"),"port":p.get("port")} for p in d.get("proxies", [])]
              save("verified-clash-summary.json", {"source":d.get("source"),"generated_at":d.get("generated_at"),"candidate_count":d.get("candidate_count"),"tested_count":d.get("tested_count"),"verified_count":d.get("verified_count"),"status":d.get("status"),"proxies":safe,"verification":d.get("verification", [])})
          PY
      - name: Save redacted collection summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: personal-node-summary
          path: |
            nodes-summary.json
            public-clash-summary.json
            verified-clash-summary.json
          if-no-files-found: ignore
          retention-days: 3
      - name: Publish VPNGate snapshot to Worker
        if: ${{ hashFiles('nodes.json') != '' }}
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_ADMIN_TOKEN: ${{ secrets.WORKER_ADMIN_TOKEN }}
        run: |
          if [ -z "$WORKER_URL" ] || [ -z "$WORKER_ADMIN_TOKEN" ]; then
            echo "::notice::Worker secrets are not configured; VPNGate publish was skipped."
            exit 0
          fi
          node_count="$(python -c 'import json; print(int(json.load(open("nodes.json")).get("count", 0)))')"
          if [ "$node_count" -le 0 ]; then
            echo "::notice::VPNGate returned zero nodes; preserving the existing Worker snapshot."
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            -X POST "$WORKER_URL/api/nodes/import" \
            -H "Authorization: Bearer $WORKER_ADMIN_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @nodes.json
      - name: Publish verified Mihomo subscription to Worker
        if: ${{ hashFiles('mihomo-subscription.yaml') != '' && hashFiles('verified-clash-candidates.json') != '' }}
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_ADMIN_TOKEN: ${{ secrets.WORKER_ADMIN_TOKEN }}
        run: |
          verified_count="$(python -c 'import json; print(int(json.load(open("verified-clash-candidates.json")).get("verified_count", 0)))' 2>/dev/null || echo 0)"
          if [ "$verified_count" -le 0 ]; then
            echo "::notice::No egress-verified Mihomo nodes; preserving the previous subscription."
            exit 0
          fi
          if [ -z "$WORKER_URL" ] || [ -z "$WORKER_ADMIN_TOKEN" ]; then
            echo "::notice::Worker secrets are not configured; Mihomo subscription was built but not published."
            exit 0
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          snapshot = json.loads(Path("verified-clash-candidates.json").read_text(encoding="utf-8"))
          body = {
              "verified_count": snapshot["verified_count"],
              "generated_at": snapshot.get("generated_at"),
              "subscription_yaml": Path("mihomo-subscription.yaml").read_text(encoding="utf-8"),
          }
          Path("/tmp/mihomo-import.json").write_text(json.dumps(body), encoding="utf-8")
          PY
          curl --fail-with-body --silent --show-error \
            -X POST "$WORKER_URL/api/mihomo/import" \
            -H "Authorization: Bearer $WORKER_ADMIN_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/mihomo-import.json
      - name: Write summary
        if: always()
        run: |
          if [ -f nodes.json ]; then python -c 'import json; d=json.load(open("nodes.json")); print("VPNGate OpenVPN candidates:", d.get("count", 0))' >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f public-clash-candidates.json ]; then python -c 'import json; d=json.load(open("public-clash-candidates.json")); print("Public Mihomo candidates:", d.get("count", 0)); print("Feed:", d.get("source", "unknown"))' >> "$GITHUB_STEP_SUMMARY"; else echo 'Public Mihomo feed unavailable this run.' >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f verified-clash-candidates.json ]; then python -c 'import json; d=json.load(open("verified-clash-candidates.json")); print("Mihomo egress-verified nodes:", d.get("verified_count", 0)); print("Mihomo candidates tested:", d.get("tested_count", 0))' >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f mihomo-subscription.yaml ]; then echo "Verified-only Mihomo YAML subscription: generated" >> "$GITHUB_STEP_SUMMARY"; fi
